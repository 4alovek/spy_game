<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🕵️ Шпион</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🕵️ Шпион</h1>
    </header>

    <div id="error" class="error hidden"></div>

    <!-- Главный экран -->
    <section id="home" class="card">
      <div id="stats" class="stats hidden"></div>
      <label>Ваше имя
        <input id="name-input" type="text" maxlength="30" placeholder="Например, Аня" />
      </label>
      <button id="create-btn">Создать лобби</button>
      <div class="divider">или</div>
      <label>ID лобби
        <input id="join-input" type="text" maxlength="4" inputmode="numeric" placeholder="1234" />
      </label>
      <button id="join-btn" class="secondary">Войти в лобби</button>
    </section>

    <!-- Игровой экран (заполняется из JS) -->
    <section id="game" class="card hidden"></section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
